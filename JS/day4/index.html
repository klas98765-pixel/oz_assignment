
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실시간 암호화폐 가격 추적기</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="container">

        <header>
            <h1>암호화폐 가격 추적기</h1>
            <p>Binance 실시간 암호화폐 시세</p>
            <p id="statusText">데이터 연결 대기 중</p>
        </header>

        <!-- 코인 검색 -->
        <div class="search-box">
            <input
                type="text"
                id="searchInput"
                placeholder="코인 검색 (예: BTC, ETH)"
            >
        </div>

        <!-- 전체 / 관심목록 탭 -->
        <div class="tabs">
            <button id="allTab" class="active">
                전체보기
            </button>
            <button id="favoritesTab">
                ★ 관심목록
            </button>
        </div>

        <!-- 데이터 정보 -->
        <div class="info">
            <span id="coinCount">총 0개 코인</span>
            <span id="updatedAt">업데이트 대기 중</span>
        </div>

        <!-- 암호화폐 목록 -->
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>관심</th>
                        <th>코인</th>
                        <th>현재 가격 (USDT)</th>
                        <th>24시간 변동률</th>
                    </tr>
                </thead>
                <tbody id="coinList">
                    <!-- JavaScript로 데이터 추가 -->
                </tbody>
            </table>
        </div>

        <p id="emptyMessage" hidden>
            표시할 암호화폐가 없습니다.
        </p>

    </div>
</body>
</html>
