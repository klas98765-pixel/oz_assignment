    <h2>6. 문의 메일 보내기</h2>

    <form action="mailto:your-email@example.com"
          method="post" enctype="text/plain">

        <p>
            <label for="name">이름:</label>
            <input type="text" id="name" name="이름" required>
        </p>

        <p>
            <label for="email">이메일:</label>
            <input type="email" id="email" name="이메일" required>
        </p>

        <p>
            <label for="message">문의 내용:</label>
            <textarea id="message" name="문의내용"
                      rows="5" cols="40" required></textarea>
        </p>

        <button type="submit">메일 보내기</button>
    </form>

</body>
